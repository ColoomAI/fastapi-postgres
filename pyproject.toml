[project]
name = "fastapi-postgres"
version = "0.1.0"
description = "Tarrs-ready FastAPI + Postgres backend starter (SQLAlchemy 2.0 async + Alembic)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008 = "no function calls in default args". FastAPI's Depends() /
# Path() / Query() ARE the canonical way to declare dependencies +
# validation, so this rule fires on every router function. Off.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["build/", "dist/", ".venv/", "migrations/"]

[[tool.mypy.overrides]]
# python-jose's stubs are partial; suppress untyped-call noise around
# jwt.encode / jwt.decode without weakening strictness elsewhere.
module = "jose.*"
ignore_missing_imports = true
